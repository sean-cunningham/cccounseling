<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview — TrueBridge iframe embed</title>
    <style>
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: linear-gradient(180deg, #eef2f7 0%, #e8edf4 100%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        color: #1e3a5f;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
      }
      iframe {
        width: 100%;
        min-height: 950px;
        border: 0;
        display: block;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: #64748b;
        word-break: break-all;
      }
      code {
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>TrueBridge Therapy</h1>
      <p>Parent page preview. The appointment form is embedded via iframe.</p>
      <iframe
        src="widgets/intake-form-truebridge.html"
        title="Request an appointment"
      ></iframe>
      <p class="hint">
        Iframe:
        <code>/widgets/intake-form-truebridge.html</code>
        (production:
        <code>/widgets/intake-form.html?practice=truebridge&amp;theme=truebridge</code>)
      </p>
    </div>
  </body>
</html>
