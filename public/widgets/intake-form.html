<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Request an appointment</title>
    <script>
      window.__TB_EMBED_QUERY__ = (function () {
        var s = window.location.search;
        if (s && s.length > 1) return s;
        var href = window.location.href;
        var i = href.indexOf("?");
        return i === -1 ? "" : href.slice(i);
      })();
      
      window.__TB_FORM_STARTED_AT__ = new Date().toISOString();

      
      (function () {
        try {
          var q = window.__TB_EMBED_QUERY__ || "";
          if (!q) {
            var i = window.location.href.indexOf("?");
            q = i === -1 ? "" : window.location.href.slice(i);
          }
          var params = new URLSearchParams(
            q.charAt(0) === "?" ? q.slice(1) : q,
          );
          var practice = (params.get("practice") || "").toLowerCase();
          var frame = (params.get("frame") || "").toLowerCase();
          var mode = (params.get("mode") || "").toLowerCase();
          if (
            frame === "transparent" ||
            mode === "formonly" ||
            (practice === "truebridge" && frame !== "opaque")
          ) {
            document.documentElement.classList.add("tb-iframe--transparent");
          }
        } catch (e) {
          /* ignore */
        }
      })();

    </script>
    <style>

      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      html.tb-iframe--transparent,
      html.tb-iframe--transparent body {
        background: transparent;
      }
      #tb-intake-form-root {
        display: block;
        min-height: 1px;
      }

    </style>
  </head>
  <body>
    <div id="tb-intake-form-root" data-tb-intake-widget></div>
    <script type="module" src="../assets/widgets/intake-form-FC3kBdBX.js"></script>
  </body>
</html>
