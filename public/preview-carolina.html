<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview — Carolina iframe embed</title>
    <style>
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #ffffff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #5f6f5f;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 400;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #6d7d6d;
        font-size: 0.9375rem;
      }
      iframe {
        width: 100%;
        min-height: 950px;
        border: 0;
        display: block;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: #8b9a8b;
        word-break: break-all;
      }
      code {
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Carolina Therapy Solutions</h1>
      <p>
        Parent page preview (Squarespace-style). The form loads inside the iframe
        from the hosted bundle.
      </p>
      <iframe
        src="widgets/intake-form-carolina.html"
        title="Contact Carolina Therapy Solutions"
      ></iframe>
      <p class="hint">
        Iframe:
        <code>/widgets/intake-form-carolina.html</code>
        (production:
        <code>/widgets/intake-form.html?practice=carolinatherapysolutions&amp;theme=carolina</code>)
      </p>
    </div>
  </body>
</html>
