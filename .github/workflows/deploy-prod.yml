# Manual production deploy to AWS S3 + CloudFront.
#
# This workflow NEVER runs automatically. It only runs when a person clicks
# "Run workflow" on the Actions tab and types "deploy" to confirm. Until the
# AWS secrets below are added to the repository, running it fails safely at
# the first step without touching anything.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID          IAM user with s3:* on the site bucket and
#   AWS_SECRET_ACCESS_KEY      cloudfront:CreateInvalidation on the distribution
#   AWS_REGION                 e.g. us-east-1
#   CLOUDFRONT_DISTRIBUTION_ID the production distribution ID
#
# Why this exists: deploying from a laptop ships whatever is in that local
# checkout. This workflow always builds the committed `main` branch, so
# production matches git history exactly.

name: Deploy production (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to truebridgetherapy.com'
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check confirmation and secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_REGION: ${{ secrets.AWS_REGION != '' }}
          HAS_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo '::error::Confirmation input must be exactly "deploy". Aborting.'
            exit 1
          fi
          if [ "$HAS_AWS_KEY" != "true" ] || [ "$HAS_AWS_SECRET" != "true" ] || [ "$HAS_REGION" != "true" ] || [ "$HAS_DIST_ID" != "true" ]; then
            echo '::error::Missing AWS secrets. Add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, and CLOUDFRONT_DISTRIBUTION_ID in repo settings.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://truebridgetherapy.com --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
